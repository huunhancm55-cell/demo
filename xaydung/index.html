<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý Xây dựng</title>
<meta name="description" content="Quản lý dự án xây dựng: báo giá, nhật ký thi công, chi phí">
<meta name="theme-color" content="#d9480f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="QL Xây dựng">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav" aria-label="Điều hướng chính"></nav>
<div id="shell">
  <header id="top">
    <h1 id="title"></h1>
    <select id="pfilter" aria-label="Lọc theo dự án"></select>
  </header>
  <main id="main"></main>
</div>
<button id="fab" data-act="add" aria-label="Thêm mới">+</button>
<div id="overlay" hidden></div>
<div id="viewer" hidden data-act="closeViewer"><img alt="Ảnh nhật ký"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>
<script src="app.js"></script>
</body>
</html>
